pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://files.minecraftforge.net/maven/' }
        gradlePluginPortal()
    }
}
includeBuild("../citymod_26.1.2") {
    dependencySubstitution {
        substitute module("com.xbzstudio.citymod:citymod") using(project(":common"))
    }
}
rootProject.name = 'roadchina_unoffical'

include 'common'
include 'fabric'
include 'neoforge'
